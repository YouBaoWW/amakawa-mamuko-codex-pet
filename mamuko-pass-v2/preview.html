<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>真梦梓 通行证皮 · 动画预览</title>
<style>
:root{color-scheme:dark;font-family:system-ui,"Microsoft YaHei",sans-serif;background:#15141e;color:#eee9fa}*{box-sizing:border-box}body{margin:0;min-height:100dvh;padding:40px 24px}main{max-width:1000px;margin:auto}h1{font-size:28px;letter-spacing:.02em;margin:0 0 10px}p{color:#bcb5cd;line-height:1.7;margin:0 0 24px}.layout{display:grid;grid-template-columns:420px 1fr;gap:28px}.stage{border:1px solid #3c354b;border-radius:24px;background:radial-gradient(ellipse at center,#30293e,#1b1824);padding:20px;text-align:center;min-height:460px;display:flex;flex-direction:column;justify-content:center;align-items:center}canvas{width:288px;height:312px;max-width:100%;object-fit:contain}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-content:start}button{appearance:none;background:#252030;border:1px solid #443950;border-radius:12px;padding:13px 8px;font:inherit;color:inherit;cursor:pointer}button:hover{background:#332a41}button[aria-pressed=true]{background:#433154;border-color:#b393d4}.opts{display:flex;gap:20px;flex-wrap:wrap;margin:20px 0}label{cursor:pointer;font-size:14px;color:#c6bdd4}input{accent-color:#b393d4}.status{font-size:13px;color:#b8a4cd;margin-top:16px;min-height:20px}.directions{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;margin-top:18px}.direction{display:flex;flex-direction:column;align-items:center;border-radius:12px;background:#201b2b;border:1px solid #383042;padding:6px;cursor:pointer}.direction .sprite{width:96px;height:104px;background-image:url(mamuko-pass/spritesheet.webp);background-size:768px 1144px}.direction small{font-size:11px;color:#bcb2ca;margin-top:4px}.meta{margin-top:30px;font-size:13px;color:#9f94b1}@media(max-width:800px){body{padding:24px 14px}.layout{grid-template-columns:1fr}.stage{min-height:390px}.directions{grid-template-columns:repeat(4,1fr)}.direction .sprite{width:72px;height:78px;background-size:576px 858px}}
</style><main><h1>真梦梓 通行证皮</h1><p>9 组标准动画 · 16 个注视方向 · 滑冰鞋与薄蓝色鞋跟</p>
<div class="layout"><div class="stage"><canvas id="pet" width="192" height="208" aria-label="真梦梓动画"></canvas><div class="status" id="status">载入中</div></div><div><div class="controls" id="states"></div><div class="opts"><label><input id="play" type="checkbox" checked> 播放动画</label><label><input id="follow" type="checkbox"> 注视指针</label></div><p style="font-size:14px">选择动作查看完整循环。打开「注视指针」后，在预览区域移动鼠标。也可以点击下方的方向帧。</p></div></div>
<div class="directions" id="directions"></div><p class="meta">Codex v2 · 1536 × 2288 · 单帧 192 × 208。此页用于预览，状态切换由 Codex 控制。</p></main>
<script>
const states=[['待机',0,[280,110,110,140,140,320]],['向右滑行',1,[120,120,120,120,120,120,120,220]],['向左滑行',2,[120,120,120,120,120,120,120,220]],['挥手',3,[140,140,140,280]],['跳跃',4,[140,140,140,140,280]],['失落',5,[140,140,140,140,140,140,140,240]],['等待输入',6,[150,150,150,150,150,260]],['工作',7,[120,120,120,120,120,220]],['审阅',8,[150,150,150,150,150,280]]];
const degree=['000','022.5','045','067.5','090','112.5','135','157.5','180','202.5','225','247.5','270','292.5','315','337.5'];
const c=document.querySelector('#pet'),ctx=c.getContext('2d'),img=new Image(),status=document.querySelector('#status'),play=document.querySelector('#play'),follow=document.querySelector('#follow');let state=0,frame=0,last=0,look=null,ready=false;
play.checked=!matchMedia('(prefers-reduced-motion: reduce)').matches;
function draw(){if(!ready)return;ctx.clearRect(0,0,192,208);const row=look===null?states[state][1]:9+Math.floor(look/8),col=look===null?frame:look%8;ctx.drawImage(img,col*192,row*208,192,208,0,0,192,208);status.textContent=look===null?`${states[state][0]} · ${frame+1}/${states[state][2].length}`:`注视 ${degree[look]}°`}
function select(i){state=i;frame=0;last=performance.now();look=null;document.querySelectorAll('#states button').forEach((b,j)=>b.setAttribute('aria-pressed',String(i===j)));draw()}
states.forEach((s,i)=>{const b=document.createElement('button');b.textContent=s[0];b.setAttribute('aria-pressed',String(i===0));b.onclick=()=>select(i);document.querySelector('#states').append(b)});
degree.forEach((d,i)=>{const b=document.createElement('button');b.className='direction';const sp=document.createElement('span');sp.className='sprite';const label=document.createElement('small');label.textContent=d+'°';b.append(sp,label);b.onclick=()=>{look=i;draw()};document.querySelector('#directions').append(b);const set=()=>{const factor=matchMedia('(max-width:800px)').matches ? .375 : .5;sp.style.backgroundPosition=`${-(i%8)*192*factor}px ${-(9+Math.floor(i/8))*208*factor}px`};set();window.addEventListener('resize',set)});
c.parentElement.addEventListener('pointermove',e=>{if(!follow.checked)return;const r=c.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2;if(Math.hypot(dx,dy)<25){look=null;select(0)}else{const angle=(Math.atan2(dx,-dy)*180/Math.PI+360)%360;look=Math.round(angle/22.5)%16}draw()});c.parentElement.addEventListener('pointerleave',()=>{if(follow.checked){look=null;last=performance.now();draw()}});follow.onchange=()=>{look=null;draw()};play.onchange=()=>{frame=0;last=performance.now();draw()};
function tick(t){if(ready&&look===null&&play.checked&&t-last>=states[state][2][frame]){frame=(frame+1)%states[state][2].length;last=t;draw()}requestAnimationFrame(tick)}img.onload=()=>{ready=true;last=performance.now();draw();requestAnimationFrame(tick)};img.onerror=()=>status.textContent='图集载入失败，请保持 preview.html 与 mamuko-pass 文件夹同层';img.src='mamuko-pass/spritesheet.webp';
</script></html>
